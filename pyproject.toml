[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-cache-lens"
version = "0.2.0"
description = "Inspect, preview and export Telegram macOS video caches with a simple CLI and a standalone Mac window."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
tg-cache-lens = "tg_cache_lens.__main__:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.8,<7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pyinstaller>=6", "pillow>=11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
