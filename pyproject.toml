[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-cache-lens"
version = "0.5.5"
description = "Inspect, preview and export supported Telegram video caches on macOS and Windows."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = [
    "cryptography>=44,<51",
    "xxhash>=3.5,<4",
    "psutil>=6.1,<8; sys_platform == 'win32'",
]

[project.scripts]
tg-cache-lens = "tg_cache_lens.__main__:main"

[project.optional-dependencies]
gui = [
    "pyside6>=6.8,<7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pyinstaller>=6", "pillow>=11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
