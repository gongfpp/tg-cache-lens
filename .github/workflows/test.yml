name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: brew install ffmpeg
      - run: uv sync --frozen --extra gui --python 3.12
      - run: uv run --extra gui pytest -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.7'
      - run: choco install ffmpeg -y --no-progress
      - run: uv sync --frozen --extra gui --python 3.12
      - run: uv run --extra gui pytest -q
